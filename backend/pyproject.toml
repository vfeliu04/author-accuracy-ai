[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authorai"
version = "2.0.0a0"
description = "Author AI v2 backend — fact-checks a report against trusted source documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlite-vec==0.1.9",
    "openai==2.53.0",
    "numpy==2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.1",
]

[tool.setuptools]
packages = ["authorai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
