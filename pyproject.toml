[tool.poetry]
name = "author_ai"
version = "0.1.0"
description = "Extract atomic quantitative claims from free text into structured JSON."
authors = ["Author AI"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "author_ai" },
    { include = "cli" }
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6.4"
regex = "^2023.12.25"
quantulum3 = "^0.9.0"
dateparser = "^1.2.0"
rapidfuzz = "^3.6.1"
click = "^8.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pre-commit = "^3.6.0"
ruff = "^0.3.7"
black = "^24.3.0"

[tool.poetry.scripts]
author-extract = "cli.main:extract_cli"
author-verify = "cli.main:verify_cli"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "S"]
ignore = ["S311"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
